name: Offerings book

# Builds the print-ready PDF book (tools/book) on GitHub, so nothing has to be installed locally.
# Actions tab → "Offerings book" → Run workflow. The PDFs and the review report are attached to the run.
# Editorial decisions are read from tools/book/edits/<year>.json on the branch you run it from.
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to print, e.g. 2025
        required: true
      letters:
        description: One book with names from these letters, e.g. P-R or A,B,D-F (blank = all letters)
        required: false
        default: ''
      volumes:
        description: Or several books, e.g. A-C,D-J,K-N,P-R,S,T-Z — or auto to split by page count
        required: false
        default: ''
      max_pages:
        description: Most pages per book when volumes is auto
        required: false
        default: '200'
      label:
        description: Label on the title page for a single book, e.g. Book 3
        required: false
        default: ''
      size:
        description: Paper size
        type: choice
        options: [a4, letter, a5]
        default: a4
      review_only:
        description: Only write the review report (no PDF)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/book
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/book/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: ${{ !inputs.review_only }}
        run: npx playwright install --with-deps chromium

      - name: Cache fonts
        if: ${{ !inputs.review_only }}
        uses: actions/cache@v4
        with:
          path: tools/book/.cache/fonts
          key: book-fonts-${{ hashFiles('tools/book/lib/html.mjs', 'tools/book/lib/fonts.mjs') }}

      - name: Build
        env:
          YEAR: ${{ inputs.year }}
          LETTERS: ${{ inputs.letters }}
          VOLUMES: ${{ inputs.volumes }}
          MAX_PAGES: ${{ inputs.max_pages }}
          LABEL: ${{ inputs.label }}
          SIZE: ${{ inputs.size }}
          REVIEW_ONLY: ${{ inputs.review_only }}
        run: |
          set -euo pipefail
          args=(--year "$YEAR" --size "$SIZE" --browser chromium)
          if [ "$REVIEW_ONLY" = "true" ]; then args+=(--review-only); fi
          if [ -n "$LETTERS" ]; then args+=(--letters "$LETTERS"); fi
          if [ -n "$VOLUMES" ]; then args+=(--volumes "$VOLUMES" --max-pages "${MAX_PAGES:-200}"); fi
          if [ -n "$LABEL" ]; then args+=(--label "$LABEL"); fi
          node build.mjs "${args[@]}" 2>&1 | tee build.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### Offerings book'
            echo
            echo 'Download the PDFs and the review report from **Artifacts** at the bottom of this page.'
            echo
            echo '```'
            cat build.log 2>/dev/null || echo 'The build did not start; see the steps above.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offerings-book-${{ inputs.year }}
          path: |
            tools/book/out/*.pdf
            tools/book/out/*-review.md
          if-no-files-found: ignore
          retention-days: 30
